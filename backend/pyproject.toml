[project]
name = "eco311-backend"
version = "0.1.0"
description = "311 / environment reporting API + LangGraph agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-groq>=1.1,<2",
  "python-multipart>=0.0.9",
  "pyjwt>=2.9",
  "langchain-openai>=1.0,<2",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "langchain-groq>=1.1,<2",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.3"]
postgres = ["psycopg[binary]>=3.2", "langgraph-checkpoint-postgres>=2.0"]
aws = ["boto3>=1.35"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
